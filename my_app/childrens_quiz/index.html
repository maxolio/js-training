<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кто на картинке?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Segoe UI', cursive, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Карточка игры */
    .quiz-card {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      padding: 24px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* 1. Главный вопрос */
    .question-title {
      font-size: 26px;
      color: #1e293b;
      font-weight: 800;
    }

    /* 2. Картинка-заглушка */
    .image-box {
      width: 100%;
      height: 250px;
      background: #f1f5f9;
      border: 4px solid #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Фраза при отгадывании */
    .phrase-text {
      font-size: 22px;
      font-weight: bold;
      color: #0f172a;
      min-height: 30px;
    }

    /* 3. Контейнер кнопок */
    .answers-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* Кнопки ответов */
    .btn-option {
      background-color: #ffffff;
      border: 3px solid #cbd5e1;
      border-bottom: 6px solid #94a3b8;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 22px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      user-select: none;
    }

    .btn-option:active {
      transform: translateY(3px);
      border-bottom-width: 3px;
    }

    /* Правильный ответ (зеленый) */
    .btn-option.correct {
      background-color: #86efac !important;
      border-color: #22c55e !important;
      border-bottom-color: #15803d !important;
      color: #14532d !important;
      animation: bounce 0.5s ease;
    }

    /* Неправильный ответ (тряска) */
    .btn-option.wrong {
      background-color: #fecaca !important;
      border-color: #ef4444 !important;
      border-bottom-color: #b91c1c !important;
      color: #7f1d1d !important;
      animation: shake 0.4s ease;
    }

    /* Анимации */
    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  </style>
</head>
<body>

<div class="quiz-card">
  <!-- 1. Вопрос -->
  <h1 class="question-title">Кто на картинке?</h1>

  <!-- 2. Картинка -->
  <div class="image-box">
    <img id="card-image" src="" alt="Изображение">
  </div>

  <!-- Текст ответа / подсказка -->
  <div class="phrase-text" id="phrase-text">Выбери ответ 👇</div>

  <!-- 3. Три кнопки -->
  <div class="answers-grid" id="buttons-container"></div>
</div>

<script>
  // ==========================================
  // ДАННЫЕ КАРТОЧЕК
  // ==========================================
  const quizData = [
    {
      image: "lion.png",
      placeholderText: "🦁 Заглушка: Лев",
      options: ["Слон", "Лев", "Жираф"],
      correctIndex: 1,
      phrase: "Это лев!"
    },
    {
      image: "bear.png",
      placeholderText: "🐻 Заглушка: Медведь",
      options: ["Медведь", "Волк", "Заяц"],
      correctIndex: 0,
      phrase: "Это медведь!"
    },
    {
      image: "cat.png",
      placeholderText: "🐱 Заглушка: Кот",
      options: ["Собака", "Кот", "Мышка"],
      correctIndex: 1,
      phrase: "Это кот!"
    }
  ];

  let currentStep = 0;
  let isLocked = false;

  const cardImage = document.getElementById("card-image");
  const phraseText = document.getElementById("phrase-text");
  const buttonsContainer = document.getElementById("buttons-container");

  // Озвучка с функцией обратного вызова (onComplete)
  function speakText(text, onComplete) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();

      const voice = new SpeechSynthesisUtterance(text);
      voice.lang = 'ru-RU';
      voice.rate = 0.9;

      // Флаг защиты от повторного срабатывания
      let isDone = false;
      const triggerComplete = () => {
        if (!isDone) {
          isDone = true;
          if (onComplete) onComplete();
        }
      };

      // КЛЮЧЕВОЕ СОБЫТИЕ: срабатывает, когда озвучка завершилась
      voice.onend = () => {
        // Небольшая естественная пауза 400 мс после окончания речи
        setTimeout(triggerComplete, 400);
      };

      // Если в браузере произошла ошибка озвучки
      voice.onerror = () => {
        triggerComplete();
      };

      // Страховка (fallback) на случай зависания синтезатора речи
      setTimeout(triggerComplete, 4000);

      window.speechSynthesis.speak(voice);
    } else {
      // Если браузер вообще не поддерживает озвучку
      setTimeout(onComplete, 1200);
    }
  }

  // Отрисовка карточки
  function renderCard() {
    isLocked = false;
    const current = quizData[currentStep];

    // Загрузка картинки / заглушки
    cardImage.src = current.image;
    cardImage.onerror = function() {
      this.src = `https://placehold.co/600x400/ffd166/333333?text=${encodeURIComponent(current.placeholderText)}`;
    };

    phraseText.textContent = "Выбери ответ 👇";
    buttonsContainer.innerHTML = "";

    // Создание кнопок
    current.options.forEach((optionTitle, index) => {
      const btn = document.createElement("button");
      btn.classList.add("btn-option");
      btn.textContent = optionTitle;

      btn.addEventListener("click", () => checkAnswer(btn, index));
      buttonsContainer.appendChild(btn);
    });
  }

  // Проверка ответа
  function checkAnswer(button, selectedIndex) {
    if (isLocked) return;

    const current = quizData[currentStep];

    if (selectedIndex === current.correctIndex) {
      // === ПРАВИЛЬНЫЙ ОТВЕТ ===
      isLocked = true;
      button.classList.add("correct");
      phraseText.textContent = current.phrase;

      // Передаем функцию переключения в качестве колбэка
      speakText(current.phrase, () => {
        currentStep = (currentStep + 1) % quizData.length;
        renderCard();
      });

    } else {
      // === ОШИБКА ===
      button.classList.add("wrong");
      setTimeout(() => {
        button.classList.remove("wrong");
      }, 400);
    }
  }

  // Запуск игры
  renderCard();
</script>
</body>
</html>
